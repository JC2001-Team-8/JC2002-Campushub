# =====================================================================
# 迭代一 后端工程骨架 —— 开发环境配置（profile: dev）
# =====================================================================
# 文件     : src/main/resources/application-dev.yml
# 版本     : v1.0
# 日期     : 2026-10-12
# 作者     : 后端工程负责人（待填写姓名）
# 状态     : 草稿（待确认）
#
# 用法     : mvn spring-boot:run -Dspring-boot.run.profiles=dev
#            或 java -jar campus-trade.jar --spring.profiles.active=dev
#            或环境变量 SPRING_PROFILES_ACTIVE=dev
#
# 说明     : 仅覆盖开发期差异：日志更详细、SQL 可见、Swagger 可试调用。
#            **不覆盖**数据库连接与 Flyway 行为（保持与主配置一致）。
# =====================================================================

logging:
  level:
    root: INFO
    com.jc2001.campustrade: DEBUG        # 项目包 DEBUG（开发期）
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG  # 便于观察过滤链匹配（下一步收紧权限时有用）
    org.flywaydb: DEBUG                  # 观察 V1~V4 逐条执行
    org.hibernate.SQL: DEBUG             # 显示 SQL
    org.hibernate.orm.jdbc.bind: TRACE   # 显示绑定参数（骨架阶段无实体，暂不产生输出）
    com.zaxxer.hikari: INFO

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        # 开发期显示统计，便于观察 N+1（骨架阶段无查询）
        generate_statistics: false

springdoc:
  swagger-ui:
    # 开发期允许在 Swagger UI 中直接试调用
    try-it-out-enabled: true
    display-request-duration: true
  api-docs:
    enabled: true

management:
  endpoint:
    health:
      # 开发期展示健康详情，便于排查数据库连通性
      show-details: always

app:
  cors:
    enabled: true
    # 开发期前端（Vite 默认 5173）
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
