        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            商品已被占用（E-04 / `ITEM_ALREADY_RESERVED`）、
            已被交换占用（`ITEM_RESERVED_BY_SWAP`）、
            或幂等键冲突（E-16 / `COMMON_IDEMPOTENCY_KEY_REUSED`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ITEM_ALREADY_RESERVED
                message: 商品已被其他订单占用
                details:
                  itemId: 12
                  currentStatus: RESERVED
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"
        '422':
          description: |
            跨区域交易（E-17 / `TRADE_ZONE_MISMATCH`）、
            交易区域未勾选（`TRADE_ZONE_NOT_SELECTED`）、
            商品不可购买（`ITEM_NOT_PURCHASABLE`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

