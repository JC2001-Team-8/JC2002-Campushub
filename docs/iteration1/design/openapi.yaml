        扫描 **仅处于未关闭且非终态** 的订单：
        `review_status IN ('OPEN','BUYER_REVIEWED','SELLER_REVIEWED') AND now() > review_deadline`，
        置为 `WINDOW_CLOSED`，关闭评价入口。

        **必须排除终态 `BOTH_REVIEWED`**：`BOTH_REVIEWED`（双方已评）与 `WINDOW_CLOSED` 均为终态，
        受 **IDEM-C 终态保护**（评价状态机 R-05）。若写成 `review_status <> 'WINDOW_CLOSED'`，
        会把已经双方评价完成的订单**回退**为 `WINDOW_CLOSED`，违反状态机 §8 的 R-04 起始状态集合
        （R-04 的起始状态是「任意未关闭」中的**活跃态**：OPEN / BUYER_REVIEWED / SELLER_REVIEWED）。

        **注意**：**不自动生成差评**（R-14 / 假设 A-07）；**幂等（IDEM-B）**：重复执行不报错。
        建议每小时执行一次。
