# =====================================================================
# 迭代一 校园/社区闲置交易平台 —— 接口契约（OpenAPI 3.0.3）
# =====================================================================
# 文件     : docs/iteration1/design/openapi.yaml
# 版本     : v1.0
# 日期     : 2026-10-12
# 作者     : 接口契约负责人（待填写姓名）
# 状态     : 冻结候选（FROZEN-CANDIDATE）
# 目标栈   : Java 11 + Spring Boot 2.7.18 + PostgreSQL 15
#
# 依据文档 :
#   ../requirements.md            54 FR、7 类角色、17 类错误场景（E-01~E-17）
#   ../permission-matrix.md       7 主体 × 6 域权限矩阵
#   ../state-machines.md          6 大状态机 + 评价状态机（枚举唯一依据）
#   ../rules.md                   34 条规则（R-01~R-35），含幂等/并发/时间语义
#   ../pages-and-flows.md         22 页面 + 4 流程
#   design/schema.md              25 张表 / 324 列字段字典（DTO 对齐依据）
#   src/main/resources/db/migration/V1__init_schema.sql  枚举定义
#
# 冻结约束：**2026-10-09 之后不允许新增接口**，变更须走 api-freeze.md §4 流程。
# 详细说明见：api-contract.md / api-permission-mapping.md / error-codes.md /
#            idempotency-and-concurrency.md / api-freeze.md / api-open-questions.md
# =====================================================================

info:
  title: 校园/社区闲置交易平台 API
  version: 1.0.0-frozen-candidate
  description: |
    ## 迭代一范围（冻结候选）

    面向 **2–3 个校区及周边社区** 的闲置物品交易平台。支持两条主线：

    - **购买主线**：浏览 → 加购物车 → 提交订单（**下单即占用库存**）→ 30 分钟付款倒计时
      → 模拟付款 → 选择公共取货点 → 卖家交付 → 买家确认收货 → 互评。
    - **交换主线**：设置接受交换 → 创建交换包（1–5 件）→ 发起交换提议 → 整包接受/拒绝/反提案
      → 生成一次性交换码 → 双方确认 → 完成。

    平台**不读定位、不填住址、不做地图导航**；交易范围由预设「交易区域」限定，
    交付地点为区域内的「公共取货点」。

    ## 明确不做（详见 ../out-of-scope.md，18 项）

    - **OOS-01 真实支付**：仅提供 `mock-pay` 模拟付款，不接入任何支付通道，不支持退款。
    - **OOS-02 多人交换链**：仅一对一交换，参与方恰好两个。
    - **OOS-03 现金补差价**：交换包仅展示估价合计，不做等价判定。
    - **OOS-04 部分接受交换包**：**整包接受或整包拒绝**，接受接口不接受物品子集参数。
    - OOS-05/06/07 定位、住址、地图、跨区交易；OOS-08 站内聊天；OOS-09 推荐算法；
      OOS-10 复杂议价；OOS-11 第三方登录；OOS-12 多管理员角色；OOS-13 用户注销；
      OOS-14 退款售后；OOS-15 发票；OOS-16 物流；OOS-17 生产级运维；OOS-18 对象存储。

    ## 全局约定

    | 项 | 约定 |
    | --- | --- |
    | 基础路径 | `/api/v1` |
    | 认证 | `Authorization: Bearer <JWT>`（`bearerAuth`）；令牌有效期 7 天（假设 A-06） |
    | 响应包络 | 统一 `ApiResponse`：`code` / `message` / `data` / `traceId` / `timestamp` |
    | 分页 | 请求 `page`（0 起）+ `size` + `sort`；响应 `PageResult` |
    | 错误响应 | `ErrorResponse`：`code` / `message` / `details` / `traceId` / `timestamp` |
    | 幂等 | 关键写操作要求 `Idempotency-Key` 请求头，见 idempotency-and-concurrency.md |
    | 时间 | ISO 8601 UTC，形如 `2026-10-12T13:20:41Z`；服务端时间为准（R-19） |
    | 金额 | `DecimalString`：十进制字符串（如 `"120.00"`），单位**人民币元**，2 位小数；**禁止浮点误差** |
    | 乐观锁 | 需要条件更新的接口要求请求体带 `version` 或通过状态前置条件隐式保证（R-18） |
    | 权限声明 | 每个操作使用 `x-required-roles` 扩展 + description 双重说明 |
    | 占位数据 | 校区/社区/取货点使用占位编码（`CAMPUS_A`、`COMMUNITY_A1`、`PICKUP_LIBRARY_A`），**【待确认】** |

    ## 权限模型（7 类主体）

    访客（匿名） / 注册用户 / 卖家（关系角色） / 买家（关系角色） / 管理员 / 被处罚用户 / 系统定时任务。

    > **卖家与买家不是注册身份**，而是「用户对其自有商品/其参与的订单」上的关系角色。
    > **管理员不参与交易**（P-00-A）：`ROLE_ADMIN` 对任何下单、发布商品、发起交换操作一律 403。

    ## 错误语义分区

    | HTTP | 语义 | 说明 |
    | --- | --- | --- |
    | 400 | 语法/格式错误 | 类型错误、超出长度、缺必填、非法枚举值 |
    | 401 | 未认证 | 未携带或令牌失效（E-01） |
    | 403 | 已认证但无权限 | 非本人（E-02）、被处罚用户禁写（E-03）、管理员交易（P-00-A） |
    | 404 | 资源不存在 | 仅用于「路由目标不存在」，**不再用 404 掩盖越权**（E-02 用 403） |
    | 409 | 状态/并发冲突 | 占用冲突（E-04/E-10）、终态保护（E-05/E-09）、幂等冲突（E-16） |
    | 422 | 业务规则不满足 | 语法合法但违反业务规则（如交换包超 5 件 E-07、跨区交易 E-17） |
    | 429 | 限流 | 登录/注册等敏感接口触发限流 |
    | 500 | 服务端错误 | 未预期异常，携带 `traceId` 便于排查 |

    ## 内部接口

    路径以 `/internal/` 开头的接口**仅供系统定时任务调用**（FR-601~FR-604），
    不作为公开 API 暴露，需 `ROLE_SYSTEM` 或内网调用凭证。

  contact:
    name: 接口契约负责人（待填写姓名）
  license:
    name: 仅用于课程/内部迭代交付，未指定开源许可证

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发（后端工程骨架默认端口 8080）
  - url: https://{host}/api/v1
    description: 占位生产地址（OOS-17：迭代一不做生产级部署）
    variables:
      host:
        default: example.invalid
        description: 【待确认】正式部署域名（迭代一不交付生产部署）

tags:
  - name: 01-认证与账户
    description: 注册、登录、令牌刷新、退出、当前用户、修改密码（FR-101~FR-104）
  - name: 02-个人资料
    description: 昵称、头像、常用交易区域、通知设置、个人主页（FR-105~FR-108）
  - name: 03-字典与区域
    description: 分类、成色、交易区域、公共取货点（预设字典，R-15 / R-06）
  - name: 04-商品
    description: 发布、编辑、上下架、列表、详情、交换意愿、图片（FR-201~FR-211）
  - name: 05-购物车
    description: 加购、改数量、移除、按卖家分组查看（FR-301~FR-302）
  - name: 06-订单与付款
    description: 提交订单、占用库存、倒计时、模拟付款、取消、取货点、交付、确认收货（FR-303~FR-311）
  - name: 07-评价
    description: 交易完成后互评（FR-312）
  - name: 08-交换包
    description: 创建、编辑、查看、删除交换包（FR-402~FR-403）
  - name: 09-交换提议
    description: 发起、接受、拒绝、反提案、取消、交换码、双方确认（FR-404~FR-412）
  - name: 10-举报
    description: 举报商品与我的举报（FR-211）
  - name: 11-管理员治理
    description: 用户检索、商品下架、封禁、处罚记录、申诉处理、举报处理、审计（FR-501~FR-505）
  - name: 12-通知
    description: 站内通知列表与已读（FR-507）
  - name: 13-系统定时任务
    description: 超时释放、过期、自动解封、评价窗口关闭（FR-601~FR-604）—— 内部接口

security:
  - bearerAuth: []

# =====================================================================
# 全局可复用组件
# =====================================================================
components:

  securitySchemes:

    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: |
        **内部接口专用凭证**（不是用户 JWT）。

        仅 `/internal/**` 路径使用，供系统定时任务调用（FR-601~FR-604）：
        - 不通过 `bearerAuth` 鉴权，而使用内网调用凭证 / `ROLE_SYSTEM` 服务账号；
        - 生产环境应在网关层**禁止外部访问** `/internal/` 前缀；
        - 该凭证由部署环境注入（环境变量），**不得**下发到浏览器端。

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登录成功后签发的访问令牌，有效期 7 天（假设 A-06 / R-01）。
        请求头形如：`Authorization: Bearer eyJhbGciOi...`
        令牌过期或无效返回 `401 AUTH_TOKEN_EXPIRED` / `AUTH_UNAUTHENTICATED`。
        【待确认 Q-07】是否需要 refresh token 刷新机制（本契约已预留 `POST /auth/refresh`）。

  parameters:

    PageParam:
      name: page
      in: query
      required: false
      description: 页码，**从 0 开始**（R-19：分页与排序在接口层冻结，OOS-09 不做个性化排序）
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      example: 0

    SizeParam:
      name: size
      in: query
      required: false
      description: 每页条数，1–100，默认 20
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    SortParam:
      name: sort
      in: query
      required: false
      description: |
        排序表达式，格式 `字段,方向`（方向 `asc` | `desc`），可重复传入多级排序。
        **迭代一允许的排序字段是白名单**（OOS-09 不做推荐/个性化排序）：
        商品列表：`published_at`（默认 desc）、`estimated_price`；
        订单列表：`created_at`（默认 desc）；
        交换提议：`created_at`（默认 desc）；
        通知：`created_at`（默认 desc）。
        传入白名单外字段返回 `COMMON_INVALID_SORT_FIELD`。
      schema:
        type: array
        items:
          type: string
        example: ["published_at,desc"]
      style: form
      explode: true

    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **必填**幂等键（R-17）。由前端生成 UUID v4（假设 A-15），同一逻辑操作重试必须复用同一键。
        语义：同用户 + 同键 + 同请求体 → 返回首次结果（IDEM-A，HTTP 200/201）；
        同键但请求体不同 → `409 COMMON_IDEMPOTENCY_KEY_REUSED`（E-16）。
        记录保留 24 小时（假设 A-08）。
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: 3f2a7c18-9b4d-4e21-8a55-0c1d2e3f4a5b

    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        **可选**幂等键（R-17）。建议携带；未携带时服务端仍以状态前置条件 + 条件更新保证不产生重复副作用。
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: 3f2a7c18-9b4d-4e21-8a55-0c1d2e3f4a5b

    VersionParam:
      name: version
      in: query
      required: false
      description: |
        乐观锁版本号（R-18）。传值时服务端执行条件更新
        `WHERE id=? AND version=?`；版本不匹配返回 `409 COMMON_VERSION_CONFLICT`。
        不传值时仅按状态前置条件校验（仍禁止「先查后改」）。
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 0

    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      description: 调用方传入的链路追踪 ID；未传时由服务端生成，并在响应体与响应头回写。
      schema:
        type: string
        maxLength: 64
      example: 7f9c1a2b3d4e5f60

  responses:

    BadRequest:
      description: |
        **400 参数/格式错误**（E-07 语法错误场景）。
        例如：字段类型错误、超出长度、缺失必填、非法枚举值、非法排序字段。
        错误码前缀 `COMMON_` / `VALIDATION_`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_INVALID_PARAMETER
            message: 参数校验失败
            details:
              - field: title
                issue: 长度必须在 1 到 60 之间
            traceId: 7f9c1a2b3d4e5f60
            timestamp: "'2026-10-12T13:20:41Z'"

    Unauthorized:
      description: |
        **401 未认证**（E-01）。未携带令牌、令牌无效或令牌过期。
        注意：登录接口凭据错误也返回 401，但错误码为 `AUTH_INVALID_CREDENTIALS`
        （**不区分账号不存在与密码错误**，避免账号枚举）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_UNAUTHENTICATED
            message: 未登录或登录态已失效，请重新登录
            details: null
            traceId: 7f9c1a2b3d4e5f60
            timestamp: "'2026-10-12T13:20:41Z'"

    Forbidden:
      description: |
        **403 已认证但无权限**（E-02 / E-03 / P-00-A）。
        包含三类：非本人资源（E-02，**刻意不用 404**）、被处罚用户执行交易写操作（E-03，响应含解封时间）、
        管理员尝试参与交易（P-00-A）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notOwner:
              summary: 非本人资源（E-02）
              value:
                code: AUTH_NOT_RESOURCE_OWNER
                message: 无权操作他人的资源
                details: null
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"
            restricted:
              summary: 被处罚用户禁写（E-03）
              value:
                code: USER_RESTRICTED_CANNOT_WRITE
                message: 账号处于处罚期，暂不可进行交易操作
                details:
                  restrictedUntil: "'2026-10-15T13:20:41Z'"
                  penaltyId: 42
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"

    NotFound:
      description: |
        **404 资源不存在**。仅用于路由目标本身不存在（如商品 ID 不存在、订单号不存在）。
        **越权访问他人资源返回 403 而非 404**（E-02）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ITEM_NOT_FOUND
            message: 商品不存在或已被删除
            details: null
            traceId: 7f9c1a2b3d4e5f60
            timestamp: "'2026-10-12T13:20:41Z'"

    Conflict:
      description: |
        **409 状态或并发冲突**。典型场景：
        - 商品已被占用（E-04 / `ITEM_ALREADY_RESERVED`）
        - 交换目标商品已被占用（E-10 / `SWAP_ITEM_OCCUPIED`）
        - 订单已超时/已取消后付款（E-05 / `ORDER_TIMEOUT_RELEASED`）
        - 提议已终结仍操作（E-09 / `SWAP_PROPOSAL_ALREADY_FINALIZED`）
        - 交换码重复核销（E-12 / `SWAP_CODE_ALREADY_VERIFIED`）
        - 重复封禁（E-13 / `GOVERNANCE_ACTIVE_PENALTY_EXISTS`）
        - 幂等键冲突（E-16 / `COMMON_IDEMPOTENCY_KEY_REUSED`）
        - 乐观锁版本不匹配（`COMMON_VERSION_CONFLICT`）

        响应 `details.currentStatus` 携带服务端最新状态，供前端刷新（R-18）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            itemReserved:
              summary: 商品已被占用（E-04）
              value:
                code: ITEM_ALREADY_RESERVED
                message: 商品已被其他订单占用
                details:
                  itemId: 12
                  currentStatus: RESERVED
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"
            versionConflict:
              summary: 乐观锁冲突（R-18）
              value:
                code: COMMON_VERSION_CONFLICT
                message: 数据已被其他请求修改，请刷新后重试
                details:
                  currentVersion: 3
                  currentStatus: PENDING_PAYMENT
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"

    UnprocessableEntity:
      description: |
        **422 业务规则不满足**（语法合法但违反业务约束）。典型场景：
        - 交换包件数越界（E-07 / `SWAP_BUNDLE_ITEM_COUNT_OUT_OF_RANGE`，须 1–5 件）
        - 跨区域交易（E-17 / `TRADE_ZONE_MISMATCH`）
        - 目标商品不接受交换（E-08 / `SWAP_TARGET_NOT_ACCEPTING`）
        - 对未完成订单评价（E-15 / `REVIEW_TRANSACTION_NOT_COMPLETED`）
        - 交换包内商品不属于本人（`SWAP_BUNDLE_ITEM_NOT_OWNED`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SWAP_BUNDLE_ITEM_COUNT_OUT_OF_RANGE
            message: 交换包物品数量必须在 1 到 5 之间
            details:
              currentCount: 6
              min: 1
              max: 5
            traceId: 7f9c1a2b3d4e5f60
            timestamp: "'2026-10-12T13:20:41Z'"

    TooManyRequests:
      description: |
        **429 限流**。应用于登录、注册等敏感接口。响应含 `Retry-After` 头。
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: COMMON_RATE_LIMITED
            message: 请求过于频繁，请稍后重试
            details:
              retryAfterSeconds: 60
            traceId: 7f9c1a2b3d4e5f60
            timestamp: "'2026-10-12T13:20:41Z'"

    InternalError:
      description: |
        **500 服务端错误**。携带 `traceId` 便于日志定位。前端应展示通用错误并允许重试。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: COMMON_INTERNAL_ERROR
            message: 服务暂时不可用，请稍后重试
            details: null
            traceId: 7f9c1a2b3d4e5f60
            timestamp: "'2026-10-12T13:20:41Z'"

    ServiceUnavailable:
      description: |
        **503 依赖不可用或维护中**。迭代一主要用于「数据库/文件存储不可用」或系统维护窗口。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: COMMON_SERVICE_UNAVAILABLE
            message: 服务维护中，请稍后重试
            details: null
            traceId: 7f9c1a2b3d4e5f60
            timestamp: "'2026-10-12T13:20:41Z'"

# =====================================================================
# DTO Schema 定义
#   规则：
#   1. 枚举取值必须与 V1__init_schema.sql 完全一致，不新增未登记枚举。
#   2. 不暴露内部字段：password_hash / deleted_at / created_by / updated_by / request_hash。
#   3. 请求 DTO 与响应 DTO 分离，请求体不复用数据库实体。
#   4. 金额使用 DecimalString（字符串十进制），避免浮点误差。
# =====================================================================
  schemas:

    # -----------------------------------------------------------------
    # 通用包络
    # -----------------------------------------------------------------

    ApiResponse:
      type: object
      description: 统一响应包络。**所有非 204 响应均使用此结构**。
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: 业务返回码。成功固定为 `OK`；失败为 `DOMAIN_REASON` 形式（见 error-codes.md）。
          example: OK
        message:
          type: string
          description: 人类可读提示信息（中文）
          example: 成功
        data:
          description: 业务数据。无数据时为 `null`。
          nullable: true
        traceId:
          type: string
          description: 链路追踪 ID，同时回写在响应头 `X-Trace-Id`
          example: 7f9c1a2b3d4e5f60
        timestamp:
          type: string
          format: date-time
          description: 服务端响应时间（ISO 8601 UTC）
          example: '2026-10-12T13:20:41Z'

    ErrorResponse:
      type: object
      description: 统一错误响应体（HTTP 状态码非 2xx 时返回）
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: 错误码，格式 `DOMAIN_REASON`，例如 `ITEM_ALREADY_RESERVED`
          example: ITEM_ALREADY_RESERVED
        message:
          type: string
          description: 面向用户的中文错误描述
          example: 商品已被其他订单占用
        details:
          nullable: true
          description: |
            错误细节。结构随错误码变化，常见键：
            `field` / `issue`（校验类）、`currentStatus`（状态冲突）、
            `currentVersion`（乐观锁）、`restrictedUntil`（处罚）、`min` / `max`（范围）。
          example:
            itemId: 12
            currentStatus: RESERVED
        traceId:
          type: string
          example: 7f9c1a2b3d4e5f60
        timestamp:
          type: string
          format: date-time
          example: '2026-10-12T13:20:41Z'

    PageResult:
      type: object
      description: 分页结果
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          description: 当前页数据
          items: {}
        page:
          type: integer
          format: int32
          description: 当前页码（从 0 开始）
          example: 0
        size:
          type: integer
          format: int32
          description: 每页条数
          example: 20
        totalElements:
          type: integer
          format: int64
          description: 总记录数
          example: 137
        totalPages:
          type: integer
          format: int32
          description: 总页数
          example: 7
        first:
          type: boolean
          description: 是否首页
          example: true
        last:
          type: boolean
          description: 是否末页
          example: false

    DecimalString:
      type: string
      description: |
        金额，**十进制字符串**，单位人民币元，固定 2 位小数（如 `"120.00"`）。
        使用字符串而非 number 以避免浮点误差（R-13）。
        `items.estimated_price` / `orders.estimated_total` / `*_snapshot` 均为 `numeric(12,2)`。
      pattern: "'^\\d{1,10}(\\.\\d{1,2})?$'"
      example: '120.00'

    EmptyData:
      type: object
      nullable: true
      description: 无业务数据的成功响应（`data` 为 null）
      example: null

    # -----------------------------------------------------------------
    # 枚举（必须与 V1__init_schema.sql 一致）
    # -----------------------------------------------------------------

    UserRole:
      type: string
      description: 用户基础角色。**卖家/买家不是注册身份**，是关系角色（P-00-A）
      enum: [USER, ADMIN]

    UserStatus:
      type: string
      description: 账号状态。`RESTRICTED` = 被处罚用户（permission-matrix §8 白名单约束）
      enum: [ACTIVE, RESTRICTED]

    ZoneType:
      type: string
      description: 交易区域类型
      enum: [CAMPUS, COMMUNITY]

    PickupPointType:
      type: string
      description: 公共取货点类型
      enum: [LIBRARY, CANTEEN, TEACHING, DORM, GATE, SQUARE]

    ItemStatus:
      type: string
      description: |
        商品状态（state-machines.md §2.1）。
        `RESERVED` = 订单占用，`SWAPPING` = 交换占用，两者**互斥**（R-23）。
        `SOLD` / `BANNED` 为终态，任何写操作返回 409（IDEM-C）。
      enum: [DRAFT, IN_SALE, RESERVED, SWAPPING, SOLD, OFF_SHELF, BANNED]

    SwapPreference:
      type: string
      description: 卖家交换意愿（R-20）。占用态与终态不可改为 `ACCEPTING`
      enum: [ACCEPTING, NOT_ACCEPTING]

    OrderStatus:
      type: string
      description: |
        订单状态（state-machines.md §3.1）。**无退款状态**（OOS-14 不做退款）。
        `COMPLETED` / `CANCELLED` / `TIMEOUT_CANCELLED` 为终态（IDEM-C）。
      enum: [PENDING_PAYMENT, PAID, DELIVERED, COMPLETED, CANCELLED, TIMEOUT_CANCELLED]

    OrderCancelReason:
      type: string
      description: 订单取消原因，区分 O-03/O-04/O-11 三条路径
      enum: [BUYER_CANCELLED, PAYMENT_TIMEOUT, ADMIN_TAKEDOWN]

    SwapBundleStatus:
      type: string
      description: 交换包状态（state-machines.md §5.1）
      enum: [DRAFT, PACKED, IN_SWAP, OCCUPIED, RELEASED, COMPLETED]

    BundleItemStatus:
      type: string
      description: 交换包物品行状态。仅 `ACTIVE` 参与「同一商品同时只在一个进行中包内」的唯一约束
      enum: [ACTIVE, RELEASED, COMPLETED]

    SwapProposalStatus:
      type: string
      description: |
        交换提议状态（state-machines.md §4.1）。
        `COUNTERED` 表示已反提案（仅一轮，R-28）；
        `COMPLETED` / `REJECTED` / `EXPIRED` / `CANCELLED` 为终态（IDEM-C）。
      enum: [PENDING, ACCEPTED, REJECTED, COUNTERED, EXPIRED, CANCELLED, COMPLETED]

    SwapTerminationReason:
      type: string
      description: |
        交换提议终结原因。`VOID_*` 系列对应 R-24 **整笔作废**（任一件被占用/下架即整笔作废）。
      enum:
        - TARGET_REJECTED
        - PROPOSER_CANCELLED
        - EXPIRED_72H
        - VOID_ITEM_OCCUPIED
        - VOID_ITEM_OFF_SHELF
        - VOID_ITEM_BANNED
        - COUNTERED

    SwapCodeStatus:
      type: string
      description: 交换码状态。`VERIFIED` 后不可再次核销（R-26 一次性）
      enum: [ISSUED, VERIFIED, EXPIRED]

    ReviewStatus:
      type: string
      description: 互评状态（state-machines.md §8，作用于订单维度）
      enum: [OPEN, BUYER_REVIEWED, SELLER_REVIEWED, BOTH_REVIEWED, WINDOW_CLOSED]

    ReviewRole:
      type: string
      description: 评价人在这笔交易中的角色
      enum: [BUYER, SELLER]

    ReportStatus:
      type: string
      description: 举报处理状态
      enum: [PENDING, HANDLED, DISMISSED]

    ReportReason:
      type: string
      description: 举报原因（FR-211 必选）
      enum: [FAKE_INFO, PROHIBITED_ITEM, WRONG_CATEGORY, SUSPECTED_FRAUD, OTHER]

    PenaltyType:
      type: string
      description: |
        处罚类型。`BAN_3D` 封禁三天（R-30，固定 72 小时，A-03）；
        `ITEM_TAKEDOWN` 违规下架处置（仅举证，不影响用户交易能力）
      enum: [BAN_3D, ITEM_TAKEDOWN]

    PenaltyStatus:
      type: string
      description: |
        处罚状态（state-machines.md §6.1）。`APPEALING` 期间**处罚仍生效**（不停表，P-03）。
        记录**永不物理删除**（R-32）。
      enum: [ACTIVE, APPEALING, LIFTED, EXPIRED]

    PenaltyLiftSource:
      type: string
      description: 解封来源（P-04 系统到期 / P-05 申诉通过 / P-07 管理员手动）
      enum: [SYSTEM_EXPIRY, APPEAL_APPROVED, ADMIN_MANUAL]

    AppealStatus:
      type: string
      description: 申诉状态（state-machines.md §7.1）。一个处罚最多一条申诉（AP-01）
      enum: [SUBMITTED, APPROVED, REJECTED]

    NotificationType:
      type: string
      description: 站内通知类型（FR-507）。【待确认 Q-05】是否仅站内渠道
      enum:
        - ORDER_CREATED
        - ORDER_PAID
        - ORDER_DELIVERED
        - ORDER_COMPLETED
        - ORDER_CANCELLED
        - ORDER_TIMEOUT_CANCELLED
        - ORDER_ADMIN_CANCELLED
        - SWAP_PROPOSED
        - SWAP_ACCEPTED
        - SWAP_REJECTED
        - SWAP_COUNTERED
        - SWAP_EXPIRED
        - SWAP_CANCELLED
        - SWAP_VOIDED
        - SWAP_COMPLETED
        - PENALTY_BANNED
        - PENALTY_LIFTED
        - PENALTY_EXPIRED
        - ITEM_BANNED
        - ITEM_RESTORED
        - APPEAL_SUBMITTED
        - APPEAL_RESOLVED
        - REPORT_HANDLED
        - REVIEW_WINDOW_OPENED
        - REVIEW_WINDOW_CLOSED

    # -----------------------------------------------------------------
    # 认证与账户
    # -----------------------------------------------------------------

    RegisterRequest:
      type: object
      description: 注册请求（FR-101）。用户名唯一、大小写不敏感（数据库 citext）
      required: [username, password, nickname]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "'^[A-Za-z0-9_]+$'"
          description: 登录用户名，唯一，大小写不敏感，仅允许字母/数字/下划线
          example: alice
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: 【待确认 Q-06】是否必填与是否需要邮箱验证；当前假设**可选且不验证**
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: 密码，至少 8 位；强度规则待接口契约冻结后由实现细化
          example: Passw0rd!2026
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          description: 昵称，1–20 字符，**不要求唯一**（假设 A-04）
          example: 爱丽丝

    LoginRequest:
      type: object
      description: 登录请求（FR-102）。凭据错误统一返回 401 `AUTH_INVALID_CREDENTIALS`，不区分账号是否存在
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 32
          example: alice
        password:
          type: string
          format: password
          maxLength: 64
          example: Passw0rd!2026

    RefreshTokenRequest:
      type: object
      description: |
        刷新令牌请求。【待确认 Q-07】当前假设采用**固定 7 天单令牌**（A-06），
        本接口为预留能力，未启用时返回 `501`（见 api-open-questions.md AQ-02）。
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: 刷新令牌
          example: eyJhbGciOiJIUzI1NiJ9.refresh

    ChangePasswordRequest:
      type: object
      description: 修改密码（permission-matrix 2.10）。需校验原密码
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
          maxLength: 64
          example: Passw0rd!2026
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: NewPassw0rd!2026

    AuthTokenResponse:
      type: object
      description: 登录/刷新成功返回的令牌
      required: [accessToken, tokenType, expiresIn, expiresAt]
      properties:
        accessToken:
          type: string
          description: JWT 访问令牌
          example: eyJhbGciOiJIUzI1NiJ9.access
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: 剩余有效秒数（7 天 = 604800，假设 A-06）
          example: 604800
        expiresAt:
          type: string
          format: date-time
          description: 令牌到期绝对时间（服务端时间为准，R-19）
          example: '2026-10-19T13:20:41Z'
        refreshToken:
          type: string
          nullable: true
          description: 刷新令牌（仅当启用刷新机制时返回；【待确认 Q-07】）
        user:
          $ref: '#/components/schemas/UserProfile'

    CurrentUserResponse:
      type: object
      description: 当前登录用户信息（FR-103 登录态保持的校验入口）
      required: [id, username, nickname, role, status, tradeZones]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        username:
          type: string
          example: alice
        email:
          type: string
          nullable: true
          example: alice@example.com
        nickname:
          type: string
          example: 爱丽丝
        avatarUrl:
          type: string
          nullable: true
          example: /static/avatars/alice.png
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        restrictedUntil:
          type: string
          format: date-time
          nullable: true
          description: 处罚解封时间。`status=RESTRICTED` 时必有值（E-03 前端提示用）
          example: '2026-10-15T13:20:41Z'
        tradeZones:
          type: array
          description: 已勾选的常用交易区域（1–5 个，FR-107）
          items:
            $ref: '#/components/schemas/TradeZone'
        version:
          type: integer
          format: int32
          description: 乐观锁版本号（R-18）
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2026-10-01T08:00:00Z'

    # -----------------------------------------------------------------
    # 个人资料
    # -----------------------------------------------------------------

    UserProfile:
      type: object
      description: 用户公开资料（FR-108）。**不含任何联系方式、住址、定位字段**
      required: [id, nickname]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        nickname:
          type: string
          example: 爱丽丝
        avatarUrl:
          type: string
          nullable: true
          example: /static/avatars/alice.png
        itemsInSaleCount:
          type: integer
          format: int64
          description: 在售商品数（由 items 聚合，非冗余字段）
          example: 2
        ratingAverage:
          type: string
          nullable: true
          description: 收到的评价平均分（1–5，保留 1 位小数）。迭代一仅展示，不参与排序（OOS-09）
          example: '4.8'
        ratingCount:
          type: integer
          format: int64
          example: 12
        createdAt:
          type: string
          format: date-time
          example: '2026-10-01T08:00:00Z'

    UpdateProfileRequest:
      type: object
      description: |
        修改个人资料（FR-105 / FR-106）。**被处罚用户在处罚期内禁止修改昵称与头像**（假设 A-13，DQ/Q-12），
        但**允许修改常用交易区域**（属于非交易写入，见 permission-matrix §8）。
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          description: 昵称，1–20 字符
          example: 爱丽丝
        avatarUrl:
          type: string
          maxLength: 255
          nullable: true
          description: 头像 URL（先通过 `POST /files/images` 上传取得）。传 `null` 表示删除头像
          example: /static/uploads/2026/10/abc.png

    UserTradeZonesRequest:
      type: object
      description: 设置常用交易区域（FR-107 / R-15）。**只能从预设区域勾选 1–5 个**，不接受自由文本地址
      required: [tradeZoneIds]
      properties:
        tradeZoneIds:
          type: array
          minItems: 1
          maxItems: 5
          description: 交易区域 ID 列表，1–5 个且必须存在于预设字典
          items:
            type: integer
            format: int64
          example: [1, 4]

    NotificationSettings:
      type: object
      description: |
        通知设置。【待确认 Q-05】当前假设**仅站内通知**。
        这是任务书列出的能力，需求基线未含独立 FR —— 已登记为 AQ-01（见 api-open-questions.md）。
      required: [inAppEnabled]
      properties:
        inAppEnabled:
          type: boolean
          description: 是否接收站内通知（关闭后仍保留处罚类强制性通知）
          example: true
        emailEnabled:
          type: boolean
          description: 是否接收邮件通知。迭代一**未实现投递**（Q-05），字段为预留，恒为 false
          example: false

    # -----------------------------------------------------------------
    # 字典与区域
    # -----------------------------------------------------------------

    TradeZone:
      type: object
      description: |
        交易区域（预设字典，R-15）。**占位数据【待确认】Q-01/Q-02**：
        当前种子为 `CAMPUS_A` / `CAMPUS_B` / `CAMPUS_C` 与 `COMMUNITY_A1` 等。
        替换占位数据时**不得改变本结构的字段与路径**。
      required: [id, code, name, zoneType]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          description: 区域编码。**【待确认】占位编码**：CAMPUS_A / COMMUNITY_A1
          example: CAMPUS_A
        name:
          type: string
          description: 区域名称。**【待确认】占位名称**（种子含「【待确认】」前缀）
          example: 【待确认】校区 A（占位名称）
        zoneType:
          $ref: '#/components/schemas/ZoneType'
        parentZoneId:
          type: integer
          format: int64
          nullable: true
          description: 父区域（社区归属校区的层级预留，OOS-07 迭代 N 跨区扩展）
          example: null
        sortOrder:
          type: integer
          format: int32
          example: 10
        active:
          type: boolean
          example: true

    PickupPoint:
      type: object
      description: |
        公共取货点（预设字典，R-06）。**占位数据【待确认】Q-03**：
        当前种子为 `PICKUP_LIBRARY_A` 等 13 个。
        **只有文字说明，没有经纬度**（OOS-06 不做地图导航）。
      required: [id, code, name, pointType, tradeZoneId]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          description: 取货点编码。**【待确认】占位编码**：PICKUP_LIBRARY_A
          example: PICKUP_LIBRARY_A
        name:
          type: string
          description: 取货点名称。**【待确认】占位名称**
          example: 【待确认】图书馆门口-校区A（占位）
        pointType:
          $ref: '#/components/schemas/PickupPointType'
        tradeZoneId:
          type: integer
          format: int64
          description: 所属交易区域。**取货点必须与订单同区域**（R-06）
          example: 1
        description:
          type: string
          nullable: true
          description: 文字说明，替代地图与导航（OOS-06）
          example: 图书馆正门台阶右侧，有监控覆盖
        sortOrder:
          type: integer
          format: int32
          example: 10

    Category:
      type: object
      description: 商品分类（预设字典，FR-206）。Q-21 假设仅管理员维护，用户不可自定义
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: TEXTBOOK
        name:
          type: string
          example: 教材书籍
        sortOrder:
          type: integer
          format: int32
          example: 10

    ItemCondition:
      type: object
      description: 商品成色（预设字典，FR-207）
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        code:
          type: string
          example: LIGHTLY_USED
        name:
          type: string
          example: 轻微使用痕迹
        sortOrder:
          type: integer
          format: int32
          example: 30

    # -----------------------------------------------------------------
    # 商品与图片
    # -----------------------------------------------------------------

    ItemImage:
      type: object
      description: 商品图片（FR-205）。`sortOrder=0` 为封面（首图）
      required: [id, imageUrl, sortOrder]
      properties:
        id:
          type: integer
          format: int64
          example: 101
        imageUrl:
          type: string
          maxLength: 255
          description: 图片访问路径（本地存储，OOS-18 不使用对象存储）
          example: /static/uploads/2026/10/abc.png
        sortOrder:
          type: integer
          format: int32
          description: 排序值，**0 表示封面**；同一商品内唯一
          example: 0
        contentType:
          type: string
          nullable: true
          description: MIME 类型，限制 jpg/png/webp（假设 A-05）
          example: image/png
        fileSize:
          type: integer
          format: int32
          nullable: true
          description: 文件字节数，单张 ≤ 5MB（假设 A-05）
          example: 102400

    ItemSummary:
      type: object
      description: 商品摘要（列表用，PF-01 商品卡片）
      required: [id, title, estimatedPrice, status, swapPreference, tradeZoneId]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: 【示例】高等数学教材（第七版）上册
        coverImageUrl:
          type: string
          nullable: true
          description: 封面图（`sortOrder=0` 的图片）
          example: /static/uploads/demo/7-1.png
        estimatedPrice:
          $ref: '#/components/schemas/DecimalString'
        currency:
          type: string
          description: 币种，固定 CNY
          example: CNY
        status:
          $ref: '#/components/schemas/ItemStatus'
        swapPreference:
          $ref: '#/components/schemas/SwapPreference'
        categoryId:
          type: integer
          format: int64
          example: 1
        categoryName:
          type: string
          example: 教材书籍
        conditionId:
          type: integer
          format: int64
          example: 3
        conditionName:
          type: string
          example: 轻微使用痕迹
        tradeZoneId:
          type: integer
          format: int64
          example: 1
        tradeZoneName:
          type: string
          description: "\"**【待确认】占位区域名称**\""
          example: 【待确认】校区 A（占位名称）
        sellerId:
          type: integer
          format: int64
          example: 2
        sellerNickname:
          type: string
          example: 爱丽丝（示例卖家）
        publishedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-09T13:20:41Z'

    ItemDetail:
      type: object
      description: 商品详情（PF-02）
      required: [id, title, description, estimatedPrice, status, swapPreference, images, tradeZoneId, seller]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: 【示例】高等数学教材（第七版）上册
        description:
          type: string
          nullable: true
          example: 有少量笔记，无破损，适合下学期使用。
        estimatedPrice:
          $ref: '#/components/schemas/DecimalString'
        currency:
          type: string
          example: CNY
        priceDisclaimer:
          type: string
          description: 固定免责声明，强调估价非平台定价（R-13）
          example: 用户自填估价，仅供参考，非平台定价
        status:
          $ref: '#/components/schemas/ItemStatus'
        swapPreference:
          $ref: '#/components/schemas/SwapPreference'
        swapDisplayStatus:
          type: string
          description: |
            详情页展示用的交换状态文案（FR-210）：
            `可交换` / `暂不交换` / `交换中` / `已交换`。
            由 `swapPreference` + `status` 推导，非数据库独立字段。
          enum: [可交换, 暂不交换, 交换中, 已交换]
          example: 可交换
        category:
          $ref: '#/components/schemas/Category'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        tradeZone:
          $ref: '#/components/schemas/TradeZone'
        images:
          type: array
          description: 图片列表，1–9 张，`sortOrder=0` 为封面
          items:
            $ref: '#/components/schemas/ItemImage'
        seller:
          $ref: '#/components/schemas/UserProfile'
        bannedReason:
          type: string
          nullable: true
          description: 违规下架原因。仅当 `status=BANNED` 且有权限查看时返回（R-34 留痕）
          example: null
        version:
          type: integer
          format: int32
          description: 乐观锁版本号，编辑时需要回传（R-18）
          example: 0
        publishedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-09T13:20:41Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-10T09:00:00Z'

    CreateItemRequest:
      type: object
      description: |
        发布商品（FR-201 / R-10）。必填：标题、分类、成色、估价、交易区域、至少 1 张图片。
        交易区域必须 ∈ 当前用户已勾选的常用交易区域（R-15），否则 422 `TRADE_ZONE_NOT_SELECTED`。
      required: [title, categoryId, conditionId, tradeZoneId, estimatedPrice, imageUrls]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
          example: 高等数学教材（第七版）上册
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: 有少量笔记，无破损。
        categoryId:
          type: integer
          format: int64
          description: 分类 ID（预设字典，FR-206）
          example: 1
        conditionId:
          type: integer
          format: int64
          description: 成色 ID（预设字典，FR-207）
          example: 3
        tradeZoneId:
          type: integer
          format: int64
          description: 交易区域 ID，必须属于当前用户已勾选区域（R-15 / FR-209）
          example: 1
        estimatedPrice:
          $ref: '#/components/schemas/DecimalString'
        imageUrls:
          type: array
          minItems: 1
          maxItems: 9
          description: 图片 URL 列表（1–9 张），先调用 `POST /files/images` 上传；**第 1 张为封面**
          items:
            type: string
            maxLength: 255
          example: [/static/uploads/2026/10/a.png]
        swapPreference:
          $ref: '#/components/schemas/SwapPreference'

    UpdateItemRequest:
      type: object
      description: |
        编辑商品（FR-202 / R-11）。
        **占用态（RESERVED / SWAPPING）禁止修改**：标题、估价、分类、成色、交易区域；
        允许修改：描述、图片（仍须 ≥1 张）。`SOLD` / `BANNED` 终态禁止任何编辑。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
          example: 高等数学教材（第七版）上册（已降价）
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: 有少量笔记。
        categoryId:
          type: integer
          format: int64
          example: 1
        conditionId:
          type: integer
          format: int64
          example: 3
        estimatedPrice:
          $ref: '#/components/schemas/DecimalString'
        tradeZoneId:
          type: integer
          format: int64
          description: 仅当商品未被占用时可修改（R-11）
          example: 1
        imageUrls:
          type: array
          minItems: 1
          maxItems: 9
          description: 图片全量替换，1–9 张；顺序即 `sortOrder`，第 1 张为封面
          items:
            type: string
            maxLength: 255
        version:
          type: integer
          format: int32
          description: "\"**必填**乐观锁版本号（R-18）。版本不匹配返回 409 `COMMON_VERSION_CONFLICT`\""
          example: 0

    UpdateSwapPreferenceRequest:
      type: object
      description: 设置商品交换意愿（FR-401 / R-20）。占用态与终态不可改为 `ACCEPTING`
      required: [swapPreference]
      properties:
        swapPreference:
          $ref: '#/components/schemas/SwapPreference'
        version:
          type: integer
          format: int32
          description: 乐观锁版本号（R-18）
          example: 0

    ItemImageUploadResponse:
      type: object
      description: 图片上传结果（FR-205）。上传与商品绑定分离，避免重复上传
      required: [imageUrl, contentType, fileSize]
      properties:
        imageUrl:
          type: string
          description: 可直接用于 `CreateItemRequest.imageUrls` 的访问路径
          example: /static/uploads/2026/10/9f8e7d6c.png
        contentType:
          type: string
          example: image/png
        fileSize:
          type: integer
          format: int32
          example: 204800

    # -----------------------------------------------------------------
    # 购物车
    # -----------------------------------------------------------------

    CartItem:
      type: object
      description: |
        购物车条目（FR-301 / R-04）。**数量固定为 1**（假设 A-16 / Q-23），单件闲置交易。
      required: [id, itemId, quantity, purchasable]
      properties:
        id:
          type: integer
          format: int64
          example: 5
        itemId:
          type: integer
          format: int64
          example: 7
        quantity:
          type: integer
          format: int32
          description: 固定为 1（A-16）
          enum: [1]
          example: 1
        item:
          $ref: '#/components/schemas/ItemSummary'
        purchasable:
          type: boolean
          description: |
            是否可结算。当商品被占用/售出/下架时为 `false`（R-04），
            前端须灰显并展示 `unavailableReason`。
          example: true
        unavailableReason:
          type: string
          nullable: true
          enum: [RESERVED_BY_ORDER, RESERVED_BY_SWAP, SOLD, OFF_SHELF, BANNED, DELETED, null]
          description: 不可结算原因，`purchasable=false` 时返回
          example: null
        addedAt:
          type: string
          format: date-time
          example: '2026-10-11T10:00:00Z'

    AddCartItemRequest:
      type: object
      description: 加入购物车（FR-301）。**不可加入自己发布的商品**（R-04），否则 422 `CART_OWN_ITEM_NOT_ALLOWED`
      required: [itemId]
      properties:
        itemId:
          type: integer
          format: int64
          example: 7

    CartGroup:
      type: object
      description: 按卖家分组的购物车（FR-302）。分组即「提交订单时按卖家拆单」的依据（R-05 / C-02）
      required: [seller, items, groupTotal]
      properties:
        seller:
          $ref: '#/components/schemas/UserProfile'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        groupTotal:
          $ref: '#/components/schemas/DecimalString'
        purchasableCount:
          type: integer
          format: int32
          description: 该分组内可结算条目数
          example: 1

    CartView:
      type: object
      description: 购物车视图（PF-09）
      required: [groups, totalItems, totalAmount]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CartGroup'
        totalItems:
          type: integer
          format: int32
          example: 3
        totalAmount:
          $ref: '#/components/schemas/DecimalString'
        priceDisclaimer:
          type: string
          example: 合计为卖家自填估价之和，仅供参考

    UpdateCartItemRequest:
      type: object
      description: |
        修改购物车条目（permission-matrix 4.3）。
        因数量固定为 1（A-16），本接口仅用于确认条目有效性，**不接受数量变更**；
        如需移除请调用 `DELETE /cart/items/{cartItemId}`。
      properties:
        version:
          type: integer
          format: int32
          example: 0

    # -----------------------------------------------------------------
    # 订单与付款
    # -----------------------------------------------------------------

    SubmitOrderRequest:
      type: object
      description: |
        提交订单（FR-303 / FR-304 / R-16）。
        **同一订单只包含一个卖家的商品**：若购物车选中项跨卖家，服务端**自动拆成多笔订单**
        （每卖家一笔，各自独立倒计时与付款，C-02 / R-05）。
        商品**在下单时即被占用**（不是付款时），并开始 30 分钟付款倒计时（假设 A-01）。
      required: [cartItemIds, tradeZoneId]
      properties:
        cartItemIds:
          type: array
          minItems: 1
          description: 待下单的购物车条目 ID（可跨卖家，服务端自动拆单）
          items:
            type: integer
            format: int64
          example: [5, 6]
        tradeZoneId:
          type: integer
          format: int64
          description: |
            交易区域。必须同时满足：属于买家已勾选区域、且与**每个**商品所属区域一致（R-15），
            否则 422 `TRADE_ZONE_MISMATCH`。
          example: 1
        note:
          type: string
          maxLength: 255
          nullable: true
          description: 买家留言（可选，非聊天功能 OOS-08）
          example: 希望周末交付

    SubmitOrderResponse:
      type: object
      description: |
        提交订单结果。若发生拆单，`orders` 包含多笔；`split=true` 时前端需提示用户
        「已按卖家拆成 N 笔订单，各自独立付款」。
      required: [orders, split, orderCount]
      properties:
        orders:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderDetail'
        split:
          type: boolean
          description: 是否发生了跨卖家拆单（C-02）
          example: false
        orderCount:
          type: integer
          format: int32
          example: 1

    OrderItem:
      type: object
      description: 订单明细（FR-303）。快照字段保证商品后续编辑不影响历史（R-13）
      required: [id, itemId, titleSnapshot, priceSnapshot]
      properties:
        id:
          type: integer
          format: int64
          example: 11
        itemId:
          type: integer
          format: int64
          example: 7
        titleSnapshot:
          type: string
          description: 下单时的标题快照
          example: 【示例】高等数学教材（第七版）上册
        priceSnapshot:
          $ref: '#/components/schemas/DecimalString'
        conditionSnapshot:
          type: string
          nullable: true
          description: 下单时的成色名称快照
          example: 轻微使用痕迹
        coverImageUrl:
          type: string
          nullable: true
          example: /static/uploads/demo/7-1.png

    OrderSummary:
      type: object
      description: 订单摘要（列表用，PF-11）
      required: [id, orderNo, status, estimatedTotal, expiresAt, remainingSeconds, role]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        orderNo:
          type: string
          example: ORD-20261012-0002
        status:
          $ref: '#/components/schemas/OrderStatus'
        role:
          type: string
          description: |
            当前用户在这笔订单中的关系角色（**卖家/买家是关系角色，不是注册身份**）：
            `BUYER` = 我是买家；`SELLER` = 我是卖家。前端据此渲染不同操作区。
          enum: [BUYER, SELLER]
          example: BUYER
        estimatedTotal:
          $ref: '#/components/schemas/DecimalString'
        itemCount:
          type: integer
          format: int32
          example: 1
        coverImageUrl:
          type: string
          nullable: true
        counterparty:
          $ref: '#/components/schemas/UserProfile'
        tradeZoneId:
          type: integer
          format: int64
          example: 1
        pickupPointName:
          type: string
          nullable: true
          description: 已选公共取货点名称；未选择时为 null（R-06）
          example: 【待确认】图书馆门口-校区A（占位）
        expiresAt:
          type: string
          format: date-time
          description: 付款截止绝对时间（仅 `PENDING_PAYMENT` 有意义，R-07 / A-01）
          example: '2026-10-12T13:50:41Z'
        remainingSeconds:
          type: integer
          format: int64
          description: |
            剩余付款秒数，**由服务端计算**（R-19：**禁止前端自行推算**）。
            非 `PENDING_PAYMENT` 状态时为 0。
          example: 900
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T13:20:41Z'

    OrderDetail:
      type: object
      description: 订单详情（PF-11）。操作可用性由 `status` + `role` 决定，前端**不得**自行推断状态转换
      required: [id, orderNo, status, role, estimatedTotal, expiresAt, remainingSeconds, items, buyer, seller, tradeZone, reviewStatus]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        orderNo:
          type: string
          example: ORD-20261012-0002
        status:
          $ref: '#/components/schemas/OrderStatus'
        role:
          type: string
          enum: [BUYER, SELLER]
          example: BUYER
        estimatedTotal:
          $ref: '#/components/schemas/DecimalString'
        priceDisclaimer:
          type: string
          example: 合计为卖家自填估价之和，仅供参考
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        buyer:
          $ref: '#/components/schemas/UserProfile'
        seller:
          $ref: '#/components/schemas/UserProfile'
        tradeZone:
          $ref: '#/components/schemas/TradeZone'
        pickupPoint:
          allOf:
            - $ref: '#/components/schemas/PickupPoint'
          nullable: true
          description: 已选公共取货点；未选择时为 null。**卖家未选定取货点前不可标记交付**（R-06）
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-12T13:50:41Z'
        remainingSeconds:
          type: integer
          format: int64
          description: 服务端计算的剩余付款秒数（R-19）
          example: 900
        paidAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          allOf:
            - $ref: '#/components/schemas/OrderCancelReason'
          nullable: true
        cancelNote:
          type: string
          nullable: true
          description: 取消说明（如系统超时说明）
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        reviewDeadline:
          type: string
          format: date-time
          nullable: true
          description: 互评窗口截止时间（仅订单 `COMPLETED` 后有意义，假设 A-07 = 7 天）
        canReview:
          type: boolean
          description: 当前用户此刻是否可以评价（`status=COMPLETED` 且在窗口内且本人未评过）
          example: false
        version:
          type: integer
          format: int32
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T13:20:41Z'

    SelectPickupPointRequest:
      type: object
      description: |
        选择公共取货点（FR-309 / R-06）。
        取货点必须属于订单所在交易区域，否则 422 `PICKUP_POINT_ZONE_MISMATCH`。
        订单 `DELIVERED` 之后不可修改。
      required: [pickupPointId]
      properties:
        pickupPointId:
          type: integer
          format: int64
          example: 1
        version:
          type: integer
          format: int32
          example: 0

    MockPayRequest:
      type: object
      description: |
        模拟付款（FR-306 / R-08）。**不接入任何真实支付通道**（OOS-01），不产生资金流水，不支持退款。
        幂等（IDEM-A）：重复请求返回首次成功结果，不重复记录付款时间。
      properties:
        confirm:
          type: boolean
          description: 前端二次确认标记（【待确认 Q-26】是否需要额外交互，当前假设一键成功）
          default: true
          example: true

    PaymentResult:
      type: object
      description: 模拟付款结果（PF-12）
      required: [orderId, orderNo, status, amount, paidAt]
      properties:
        orderId:
          type: integer
          format: int64
          example: 2
        orderNo:
          type: string
          example: ORD-20261012-0002
        status:
          $ref: '#/components/schemas/OrderStatus'
        amount:
          $ref: '#/components/schemas/DecimalString'
        channel:
          type: string
          description: 付款渠道，迭代一恒为 `MOCK`
          enum: [MOCK]
          example: MOCK
        paidAt:
          type: string
          format: date-time
          example: '2026-10-12T13:25:00Z'
        mockNotice:
          type: string
          description: 固定提示文案
          example: 模拟付款，未产生真实扣款

    CancelOrderRequest:
      type: object
      description: |
        取消订单（FR-308）。
        **仅 `PENDING_PAYMENT` 可自助取消**；已付款不可自助取消（假设 A-14 / Q-08），
        否则 409 `ORDER_CANNOT_CANCEL_AFTER_PAID`。
      properties:
        reason:
          type: string
          maxLength: 200
          nullable: true
          example: 不想买了
        version:
          type: integer
          format: int32
          example: 0

    # -----------------------------------------------------------------
    # 评价
    # -----------------------------------------------------------------

    CreateReviewRequest:
      type: object
      description: |
        互评（FR-312 / R-14）。前置条件：订单 `COMPLETED` 且在 7 天互评窗口内（假设 A-07），
        否则 409 `REVIEW_WINDOW_CLOSED` / `REVIEW_TRANSACTION_NOT_COMPLETED`。
        同一订单同一方**只能评一次**（IDEM-B），重复提交返回 409 `REVIEW_ALREADY_SUBMITTED`。
        迭代一**不做**评价标签、不做信用徽章、评价不参与排序（OOS-09）。
      required: [rating]
      properties:
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: 评分 1–5
          example: 5
        content:
          type: string
          maxLength: 500
          nullable: true
          description: 评价内容（可选）
          example: 物品与描述一致，交付很守时。

    Review:
      type: object
      description: 评价记录（R-14）
      required: [id, reviewer, reviewee, reviewerRole, rating, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        orderId:
          type: integer
          format: int64
          nullable: true
          description: 与 `swapProposalId` 二选一
          example: 2
        swapProposalId:
          type: integer
          format: int64
          nullable: true
          example: null
        reviewer:
          $ref: '#/components/schemas/UserProfile'
        reviewee:
          $ref: '#/components/schemas/UserProfile'
        reviewerRole:
          $ref: '#/components/schemas/ReviewRole'
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          example: 5
        content:
          type: string
          nullable: true
          example: 物品与描述一致。
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T14:00:00Z'

    ReviewStatusResponse:
      type: object
      description: 某个订单/交换的互评状态与我的可评性（state-machines.md §8）
      required: [reviewStatus, canReview, deadline]
      properties:
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        canReview:
          type: boolean
          example: true
        myReview:
          allOf:
            - $ref: '#/components/schemas/Review'
          nullable: true
          description: 我已提交的评价（未提交为 null）
        counterpartyReview:
          allOf:
            - $ref: '#/components/schemas/Review'
          nullable: true
          description: 对方已提交的评价。**仅在双方均已评价或窗口关闭后可见**（避免互相偷看）
        deadline:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-19T13:20:41Z'

    # -----------------------------------------------------------------
    # 交换包
    # -----------------------------------------------------------------

    SwapBundleItem:
      type: object
      description: 交换包内的物品（FR-402 / R-21）
      required: [id, itemId, itemStatus, priceSnapshot]
      properties:
        id:
          type: integer
          format: int64
          example: 21
        itemId:
          type: integer
          format: int64
          example: 8
        item:
          $ref: '#/components/schemas/ItemSummary'
        itemStatus:
          $ref: '#/components/schemas/BundleItemStatus'
        priceSnapshot:
          $ref: '#/components/schemas/DecimalString'
        releasedAt:
          type: string
          format: date-time
          nullable: true
        releaseReason:
          type: string
          nullable: true
          example: null

    SwapBundleSummary:
      type: object
      description: 交换包摘要（列表用，PF-15）
      required: [id, status, estimatedTotal, itemCount]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        title:
          type: string
          nullable: true
          example: 我的交换包
        status:
          $ref: '#/components/schemas/SwapBundleStatus'
        estimatedTotal:
          $ref: '#/components/schemas/DecimalString'
        itemCount:
          type: integer
          format: int32
          description: 包内**进行中**（`itemStatus=ACTIVE`）物品数
          example: 2
        tradeZoneId:
          type: integer
          format: int64
          example: 1
        packedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T10:00:00Z'

    SwapBundleDetail:
      type: object
      description: 交换包详情（PF-15）
      required: [id, owner, status, estimatedTotal, items]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        title:
          type: string
          nullable: true
        owner:
          $ref: '#/components/schemas/UserProfile'
        status:
          $ref: '#/components/schemas/SwapBundleStatus'
        estimatedTotal:
          $ref: '#/components/schemas/DecimalString'
        priceDisclaimer:
          type: string
          description: 强调不做差价（OOS-03）
          example: 估价合计仅供参考，平台不做等价判定、不支持现金补差价
        tradeZone:
          $ref: '#/components/schemas/TradeZone'
        items:
          type: array
          maxItems: 5
          description: 包内物品，**1–5 件**（SB-01）
          items:
            $ref: '#/components/schemas/SwapBundleItem'
        editable:
          type: boolean
          description: 当前是否可编辑。被进行中提议引用（`IN_SWAP`）时不可编辑（SB-04）
          example: true
        version:
          type: integer
          format: int32
          example: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSwapBundleRequest:
      type: object
      description: |
        创建交换包（FR-402 / R-21）。
        **1–5 件**，且**所有物品必须属于本人**，否则 422 `SWAP_BUNDLE_ITEM_NOT_OWNED`。
        同一物品同时只能存在于一个**进行中**交换包（SB-03），冲突返回 409 `SWAP_ITEM_IN_ACTIVE_BUNDLE`。
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 5
          description: 物品 ID 列表，1–5 件（E-07：越界返回 422）
          items:
            type: integer
            format: int64
          example: [8]
        title:
          type: string
          maxLength: 60
          nullable: true
          example: 我的交换包
        tradeZoneId:
          type: integer
          format: int64
          description: 交换包交易区域，须与后续目标商品同区域（R-15）
          example: 1

    UpdateSwapBundleRequest:
      type: object
      description: |
        编辑交换包（permission-matrix 5.3）。
        仅 `DRAFT` / `PACKED` / `RELEASED` 且**未被进行中提议引用**时可编辑（SB-04）；
        否则 409 `SWAP_BUNDLE_LOCKED`。
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 5
          description: 物品 ID 全量替换（1–5 件）
          items:
            type: integer
            format: int64
          example: [8, 9]
        title:
          type: string
          maxLength: 60
          nullable: true
        version:
          type: integer
          format: int32
          example: 0

    # -----------------------------------------------------------------
    # 交换提议
    # -----------------------------------------------------------------

    SwapProposalItem:
      type: object
      description: 交换提议的目标商品（C-04）。**整包接受即接受此处全部行，无部分接受**（OOS-04）
      required: [id, itemId, titleSnapshot, priceSnapshot]
      properties:
        id:
          type: integer
          format: int64
          example: 31
        itemId:
          type: integer
          format: int64
          example: 5
        titleSnapshot:
          type: string
          example: 【示例】羽毛球拍（含拍套）
        priceSnapshot:
          $ref: '#/components/schemas/DecimalString'
        item:
          $ref: '#/components/schemas/ItemSummary'

    SwapProposalSummary:
      type: object
      description: 交换提议摘要（列表用，PF-17）
      required: [id, proposalNo, status, role, expiresAt, remainingSeconds, counterDepth]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        proposalNo:
          type: string
          example: SWP-20261012-0001
        status:
          $ref: '#/components/schemas/SwapProposalStatus'
        role:
          type: string
          description: 当前用户在这条提议中的角色：`PROPOSER` = 我是发起方；`TARGET` = 我是目标方
          enum: [PROPOSER, TARGET]
          example: TARGET
        counterparty:
          $ref: '#/components/schemas/UserProfile'
        offerTotal:
          $ref: '#/components/schemas/DecimalString'
        wantTotal:
          $ref: '#/components/schemas/DecimalString'
        offerItemCount:
          type: integer
          format: int32
          example: 1
        wantItemCount:
          type: integer
          format: int32
          example: 1
        counterDepth:
          type: integer
          format: int32
          description: |
            `0` = 原提议，`1` = 反提案。**不可再反提案**（R-28 仅一轮，假设 A-10）
          example: 0
        expiresAt:
          type: string
          format: date-time
          description: 72 小时有效期绝对时间（R-25 / A-02）
          example: '2026-10-15T13:20:41Z'
        remainingSeconds:
          type: integer
          format: int64
          description: 剩余有效秒数，由服务端计算（R-19）
          example: 259200
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T13:20:41Z'

    SwapProposalDetail:
      type: object
      description: |
        交换提议详情（PF-17）。**接受为整包操作，界面不得提供物品级勾选**（OOS-04 / R-22）。
      required: [id, proposalNo, status, role, proposer, target, offerBundle, wantItems, expiresAt, remainingSeconds, counterDepth]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        proposalNo:
          type: string
          example: SWP-20261012-0001
        status:
          $ref: '#/components/schemas/SwapProposalStatus'
        role:
          type: string
          enum: [PROPOSER, TARGET]
          example: TARGET
        proposer:
          $ref: '#/components/schemas/UserProfile'
        target:
          $ref: '#/components/schemas/UserProfile'
        offerBundle:
          allOf:
            - $ref: '#/components/schemas/SwapBundleDetail'
          description: 发起方贡献的交换包（其物品被占用）
        wantItems:
          type: array
          minItems: 1
          description: 目标方的被请求商品（≥1 件，C-04）
          items:
            $ref: '#/components/schemas/SwapProposalItem'
        offerTotal:
          $ref: '#/components/schemas/DecimalString'
        wantTotal:
          $ref: '#/components/schemas/DecimalString'
        priceDisclaimer:
          type: string
          example: 双方估价合计仅供参考，平台不做等价判定、不支持现金补差价
        message:
          type: string
          nullable: true
          description: 发起说明（**非聊天**，OOS-08）
          example: 想用收纳盒换你的羽毛球拍
        tradeZone:
          $ref: '#/components/schemas/TradeZone'
        counterDepth:
          type: integer
          format: int32
          example: 0
        parentProposalId:
          type: integer
          format: int64
          nullable: true
          description: 反提案来源提议 ID（仅 `counterDepth=1` 时有值，R-28）
          example: null
        canCounter:
          type: boolean
          description: 当前用户能否发起反提案（仅目标方、状态 `PENDING`、且 `counterDepth=0`）
          example: true
        canAccept:
          type: boolean
          example: true
        canReject:
          type: boolean
          example: true
        canCancel:
          type: boolean
          description: 发起方是否可取消（仅 `PENDING`）
          example: false
        terminationReason:
          allOf:
            - $ref: '#/components/schemas/SwapTerminationReason'
          nullable: true
          description: 终结原因，`VOID_*` 表示整笔作废（R-24）
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-15T13:20:41Z'
        remainingSeconds:
          type: integer
          format: int64
          example: 259200
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        swapCode:
          allOf:
            - $ref: '#/components/schemas/SwapCode'
          nullable: true
          description: |
            一次性交换码。**仅提议双方可见**；仅在 `status=ACCEPTED` 后存在（R-26 / C-05）。
            状态未到时为 null。
        proposerConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: 发起方确认时间（R-27 双方确认 1/2）
        targetConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: 目标方确认时间（R-27 双方确认 2/2）
        myConfirmed:
          type: boolean
          description: 当前用户是否已确认（幂等，重复确认返回成功态）
          example: false
        version:
          type: integer
          format: int32
          example: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    CreateSwapProposalRequest:
      type: object
      description: |
        发起交换提议（FR-404 / R-21~R-23）。
        前置条件（不满足返回 409/422）：
        - 交换包 1–5 件且属本人；目标商品 ≥1 件且**全部属于同一目标用户**（C-04）；
        - 目标商品 `swapPreference=ACCEPTING`（否则 422 `SWAP_TARGET_NOT_ACCEPTING`）；
        - 双方同交易区域（否则 422 `TRADE_ZONE_MISMATCH`）；
        - **所有涉及商品当前均未被占用**（否则 409 `SWAP_ITEM_OCCUPIED` / `ITEM_ALREADY_RESERVED`）。

        成功后**同时占用**交换包内全部商品与目标全部商品（→ `SWAPPING`），
        并记录 `expiresAt = now + 72h`（A-02）。
      required: [proposerBundleId, targetItemIds, tradeZoneId]
      properties:
        proposerBundleId:
          type: integer
          format: int64
          description: 我方交换包 ID
          example: 3
        targetItemIds:
          type: array
          minItems: 1
          description: 目标商品 ID 列表（≥1 件，必须同属一个卖家）
          items:
            type: integer
            format: int64
          example: [5]
        tradeZoneId:
          type: integer
          format: int64
          example: 1
        message:
          type: string
          maxLength: 500
          nullable: true
          example: 想用收纳盒换你的羽毛球拍，可以吗？

    RejectSwapProposalRequest:
      type: object
      description: 拒绝交换提议（FR-406）。仅**目标方**可调用，状态须为 `PENDING`，否则 409
      properties:
        reason:
          type: string
          maxLength: 200
          nullable: true
          example: 暂时不想换

    CounterSwapProposalRequest:
      type: object
      description: |
        发起反提案（FR-407 / R-28）。仅**目标方**、`PENDING` 状态、且**此前未反提案过**可调用
        （`counterDepth` 必须为 0）。
        原提议 → `COUNTERED`（释放其占用），并创建一条新提议（proposer=原目标方，target=原发起方）。
        **不支持「反提案的反提案」**（假设 A-10），违规返回 409 `SWAP_COUNTER_NOT_ALLOWED`。
      required: [targetBundleId, targetItemIds]
      properties:
        targetBundleId:
          type: integer
          format: int64
          description: 我方（原目标方）用于反提案的交换包 ID
          example: 4
        targetItemIds:
          type: array
          minItems: 1
          description: 反提案中请求对方提供的商品 ID 列表
          items:
            type: integer
            format: int64
          example: [8]
        message:
          type: string
          maxLength: 500
          nullable: true
          example: 我想换这件，可以吗？

    SwapCode:
      type: object
      description: |
        一次性交换码（FR-409 / R-26 / C-05）。**仅提议双方可见**，禁止出现在公开列表。
        核销后状态变为 `VERIFIED`，**不可再次核销**（E-12）。
      required: [id, code, status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          maxLength: 16
          description: 交换码。**【待确认 Q-30】**格式与长度（当前种子示例 `SWP8A2F`）
          example: SWP8A2F
        status:
          $ref: '#/components/schemas/SwapCodeStatus'
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        verifiedBy:
          type: integer
          format: int64
          nullable: true
          description: 核销人用户 ID（提议双方之一）
        expiresAt:
          type: string
          format: date-time
          nullable: true
        notice:
          type: string
          example: 交换码仅双方可见，请勿对外泄露；核销后即失效

    VerifySwapCodeRequest:
      type: object
      description: |
        校验收换码（线下交付核销，R-26）。**一次性**：成功核销后再次核销返回 409 `SWAP_CODE_ALREADY_VERIFIED`。
        仅提议双方可核销，且提议状态必须为 `ACCEPTED`。
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
          example: SWP8A2F

    ConfirmSwapRequest:
      type: object
      description: |
        双方确认（FR-410 / R-27）。**双方各确认一次**，两次齐备才判定交换完成
        （全部商品 → `SOLD`，提议 → `COMPLETED`）。
        前置：交换码已核销（否则 409 `SWAP_CODE_NOT_VERIFIED`）。
        同一方重复确认**幂等成功**（IDEM-A），不重复计数。
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: 固定为 true（语义为「我已交付/已收到」）
          example: true
        remark:
          type: string
          maxLength: 200
          nullable: true

    # -----------------------------------------------------------------
    # 举报
    # -----------------------------------------------------------------

    CreateReportRequest:
      type: object
      description: |
        举报商品（FR-211）。任何登录用户可举报；**被处罚用户也可举报**（permission-matrix §8）。
        同一用户对同一商品最多 1 条**未处理**举报（C-06）；重复举报幂等（E-14）。
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/ReportReason'
        detail:
          type: string
          maxLength: 500
          nullable: true
          example: 该商品疑似违规

    Report:
      type: object
      description: 举报记录（FR-211）
      required: [id, itemId, reason, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        itemId:
          type: integer
          format: int64
          example: 3
        itemTitle:
          type: string
          example: 【示例】违规下架商品（演示用）
        reporter:
          $ref: '#/components/schemas/UserProfile'
        reason:
          $ref: '#/components/schemas/ReportReason'
        detail:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ReportStatus'
        handledBy:
          type: integer
          format: int64
          nullable: true
        handledAt:
          type: string
          format: date-time
          nullable: true
        handleNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    HandleReportRequest:
      type: object
      description: 处理举报（permission-matrix 6.9）。管理员受理或驳回，**必须填处理结论**（R-34 留痕）
      required: [status, note]
      properties:
        status:
          type: string
          enum: [HANDLED, DISMISSED]
          description: "`HANDLED` 受理；`DISMISSED` 驳回"
          example: HANDLED
        note:
          type: string
          minLength: 1
          maxLength: 255
          description: "\"**必填**处理结论\""
          example: 已核实违规，商品已下架

    # -----------------------------------------------------------------
    # 管理员治理
    # -----------------------------------------------------------------

    AdminUserSummary:
      type: object
      description: 管理员视角的用户摘要（FR-501）
      required: [id, username, nickname, role, status, itemsInSaleCount, penaltyCount]
      properties:
        id:
          type: integer
          format: int64
          example: 4
        username:
          type: string
          example: carol
        email:
          type: string
          nullable: true
        nickname:
          type: string
          example: 卡罗尔（示例用户）
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        restrictedUntil:
          type: string
          format: date-time
          nullable: true
        itemsInSaleCount:
          type: integer
          format: int64
          example: 1
        penaltyCount:
          type: integer
          format: int64
          description: 历史处罚总数（记录永不删除，R-32）
          example: 1
        activePenaltyId:
          type: integer
          format: int64
          nullable: true
          description: 当前生效中/申诉中的处罚 ID（无则为 null）
          example: 1
        registeredAt:
          type: string
          format: date-time
          example: '2026-10-01T08:00:00Z'

    AdminUserDetail:
      type: object
      description: 管理员视角的用户详情与交易概览（permission-matrix 6.2）
      required: [user, penalties, reports, appeals]
      properties:
        user:
          $ref: '#/components/schemas/AdminUserSummary'
        itemsInSale:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        penalties:
          type: array
          items:
            $ref: '#/components/schemas/Penalty'
        reports:
          type: array
          description: 该用户提交或被举报的记录
          items:
            $ref: '#/components/schemas/Report'
        appeals:
          type: array
          items:
            $ref: '#/components/schemas/Appeal'

    BanUserRequest:
      type: object
      description: |
        封禁用户（FR-503 / R-30）。
        **默认且固定 3 天（72 小时）**，不提供时长参数（假设 A-03 / Q-09：固定不可调）。
        **必须填原因**（R-34）。目标用户当前已有生效中处罚时返回 409
        `GOVERNANCE_ACTIVE_PENALTY_EXISTS`（假设 Q-10：拒绝重复封禁）。
        目标为管理员时返回 403 `GOVERNANCE_CANNOT_PUNISH_ADMIN`。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          description: "\"**必填**封禁原因\""
          example: 多次发布违规商品
        durationHours:
          type: integer
          format: int32
          readOnly: true
          description: 固定 72。**只读字段**，携带将被忽略（R-30 / A-03）
          enum: [72]
          example: 72

    TakedownItemRequest:
      type: object
      description: |
        下架违规商品（FR-502 / R-35）。**必须填原因**。
        若商品存在进行中占用，服务端**联动处理**（R-35）：
        被订单占用 → 该订单取消（`cancel_reason=ADMIN_TAKEDOWN`）；
        被交换占用 → **整笔交换作废**（`termination_reason=VOID_ITEM_BANNED`），释放全部占用。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          example: 商品信息违反平台规定
        itemId:
          type: integer
          format: int64
          description: 商品 ID（与路径参数一致时以路径参数为准）
          example: 3

    TakedownItemResponse:
      type: object
      description: 下架结果与联动影响（R-35 需要向管理员明示影响范围）
      required: [itemId, status, affectedOrders, voidedSwapProposals]
      properties:
        itemId:
          type: integer
          format: int64
          example: 3
        status:
          $ref: '#/components/schemas/ItemStatus'
        affectedOrders:
          type: integer
          format: int32
          description: 被联动取消的订单数
          example: 1
        voidedSwapProposals:
          type: integer
          format: int32
          description: 被联动**整笔作废**的交换提议数（R-24）
          example: 0
        notifiedUserIds:
          type: array
          description: 已收到通知的受影响用户
          items:
            type: integer
            format: int64
          example: [3]

    RestoreItemRequest:
      type: object
      description: 恢复被误下架商品（permission-matrix 6.4）。**必须填原因**；无占用冲突时恢复为在售
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          example: 经复核为误判，予以恢复
        restoreTo:
          type: string
          enum: [IN_SALE, OFF_SHELF]
          default: IN_SALE
          description: 恢复目标状态（I-16）
          example: IN_SALE

    Penalty:
      type: object
      description: |
        处罚记录（FR-504 / R-32）。**永不物理删除**，`status` 只反映当前态，历史结论保留。
      required: [id, targetUser, penaltyType, reason, status, startedAt, endsAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        targetUser:
          $ref: '#/components/schemas/AdminUserSummary'
        operatorId:
          type: integer
          format: int64
          description: 操作管理员 ID
          example: 1
        operatorNickname:
          type: string
          example: 平台管理员（开发占位）
        penaltyType:
          $ref: '#/components/schemas/PenaltyType'
        itemId:
          type: integer
          format: int64
          nullable: true
          description: "`ITEM_TAKEDOWN` 时关联的商品"
          example: 3
        reason:
          type: string
          description: "\"**治理动作原因，必填**（R-34）\""
          example: 多次发布违规商品
        status:
          $ref: '#/components/schemas/PenaltyStatus'
        startedAt:
          type: string
          format: date-time
          example: '2026-10-11T13:20:41Z'
        endsAt:
          type: string
          format: date-time
          description: 到期时间。`BAN_3D` 固定为 `startedAt + 72h`（R-30 / A-03）
          example: '2026-10-14T13:20:41Z'
        remainingSeconds:
          type: integer
          format: int64
          description: 距解封剩余秒数（服务端计算，R-19）
          example: 172800
        liftedAt:
          type: string
          format: date-time
          nullable: true
        liftSource:
          allOf:
            - $ref: '#/components/schemas/PenaltyLiftSource'
          nullable: true
        liftReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LiftPenaltyRequest:
      type: object
      description: 手动解封（permission-matrix 6.8）。**必须填原因**；与到期自动解封并发时只允许一方成功（R-31 条件更新）
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          example: 经人工复核，提前解封

    Appeal:
      type: object
      description: 申诉记录（FR-505 / R-32）。一个处罚最多一条申诉（AP-01），记录永不删除
      required: [id, penaltyId, appellant, reason, status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        penaltyId:
          type: integer
          format: int64
          example: 1
        penalty:
          allOf:
            - $ref: '#/components/schemas/Penalty'
          nullable: true
        appellant:
          $ref: '#/components/schemas/UserProfile'
        reason:
          type: string
          description: 申诉理由，**必填**（AP-01）
          example: 该商品已主动下架，请复核处罚
        status:
          $ref: '#/components/schemas/AppealStatus'
        handlerId:
          type: integer
          format: int64
          nullable: true
        handlerNickname:
          type: string
          nullable: true
        resolutionNote:
          type: string
          nullable: true
          description: 处理意见，**处理时必填**（R-34）
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T09:00:00Z'

    CreateAppealRequest:
      type: object
      description: |
        提交申诉（permission-matrix 2.12 / AP-01）。
        仅可对**归属本人的生效中处罚**（`ACTIVE`）提交；提交后处罚标记为 `APPEALING`，
        **处罚仍然生效**（不停表，P-03）。同一处罚重复提交返回 409 `APPEAL_ALREADY_EXISTS`。
        已解封/已过期处罚不可申诉（假设 Q-17 不允许），否则 409 `APPEAL_PENALTY_NOT_ACTIVE`。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          example: 该商品已主动下架，请复核处罚

    ResolveAppealRequest:
      type: object
      description: |
        处理申诉（FR-505 / AP-02 / AP-03）。**必须填处理意见**（R-34）。
        `APPROVED` → 立即解封（处罚 `LIFTED`，`lift_source=APPEAL_APPROVED`）；
        `REJECTED` → 处罚恢复 `ACTIVE` 并继续计到期（R-32）。
        重复处理返回首次结论（IDEM-A）。
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
          description: "`APPROVED` 申诉通过（解封）；`REJECTED` 申诉驳回"
          example: APPROVED
        note:
          type: string
          minLength: 1
          maxLength: 1000
          description: "\"**必填**处理意见\""
          example: 经复核，处罚依据不足，予以解封

    AuditLog:
      type: object
      description: 审计日志（permission-matrix 6.10 / R-34）。追加写，不可修改
      required: [id, action, targetType, targetId, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        actorId:
          type: integer
          format: int64
          nullable: true
          description: 操作者；`null` 表示系统定时任务
        actorNickname:
          type: string
          nullable: true
        actorRole:
          type: string
          nullable: true
          enum: [ADMIN, SYSTEM, USER, null]
          example: ADMIN
        action:
          type: string
          description: 动作标识，如 `ITEM_BAN` / `USER_BAN` / `ITEM_RESTORE` / `APPEAL_RESOLVE` / `REPORT_HANDLE`
          example: ITEM_BAN
        targetType:
          type: string
          enum: [ITEM, USER, PENALTY, APPEAL, REPORT, ORDER, SWAP_PROPOSAL]
          example: ITEM
        targetId:
          type: integer
          format: int64
          example: 3
        reason:
          type: string
          nullable: true
          description: 治理动作原因（治理类动作必填，R-34）
          example: 商品信息违反平台规定
        beforeState:
          type: object
          nullable: true
          additionalProperties: true
          example:
            status: IN_SALE
        afterState:
          type: object
          nullable: true
          additionalProperties: true
          example:
            status: BANNED
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T13:20:41Z'

    # -----------------------------------------------------------------
    # 通知
    # -----------------------------------------------------------------

    Notification:
      type: object
      description: 站内通知（FR-507）。
      required: [id, type, title, isRead, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: 你的商品有新订单
        body:
          type: string
          nullable: true
          example: 买家已下单，请等待付款。
        actor:
          allOf:
            - $ref: '#/components/schemas/UserProfile'
          nullable: true
          description: 触发者（系统通知为 null）
        refType:
          type: string
          nullable: true
          enum: [ORDER, SWAP, ITEM, PENALTY, APPEAL, REPORT, null]
          description: 多态业务引用类型，用于前端跳转
          example: ORDER
        refId:
          type: integer
          format: int64
          nullable: true
          example: 2
        isRead:
          type: boolean
          example: false
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T13:20:41Z'

    MarkNotificationsReadRequest:
      type: object
      description: 标记通知已读。`ids` 为空或不传表示**全部标记已读**
      properties:
        ids:
          type: array
          nullable: true
          description: 通知 ID 列表；为空表示全部
          items:
            type: integer
            format: int64
          example: [1, 2]

    UnreadCountResponse:
      type: object
      description: 未读通知数（用于前端角标）
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          format: int64
          example: 3

    # -----------------------------------------------------------------
    # 定时任务（内部）
    # -----------------------------------------------------------------

    ScheduledTaskResult:
      type: object
      description: |
        定时任务执行结果（FR-601~FR-604）。**必须幂等**（E-16 / R-07 / R-25 / R-31）：
        重复执行不产生重复副作用，`processed` 为本次实际变更条数，
        `skipped` 为因状态已变化而跳过的条数。
      required: [task, processed, skipped, executedAt]
      properties:
        task:
          type: string
          enum:
            - ORDER_TIMEOUT_RELEASE
            - SWAP_PROPOSAL_EXPIRE
            - PENALTY_AUTO_UNBAN
            - REVIEW_WINDOW_CLOSE
          example: ORDER_TIMEOUT_RELEASE
        processed:
          type: integer
          format: int32
          description: 本次实际处理的记录数
          example: 3
        skipped:
          type: integer
          format: int32
          description: 因并发/状态已变更而跳过的记录数（幂等保护）
          example: 1
        executedAt:
          type: string
          format: date-time
          example: '2026-10-12T13:21:00Z'

    # -----------------------------------------------------------------
    # 失败响应包络（HTTP 4xx/5xx 的 Response schema 引用）
    # -----------------------------------------------------------------

    FailureEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      description: 失败响应体（等价于 ErrorResponse，保留独立名称便于后续演进）

# =====================================================================
# 路径定义（按域分组）
# =====================================================================
paths:
  # ===================================================================
  # 01 认证与账户（FR-101 ~ FR-104）
  # ===================================================================

  /auth/register:
    post:
      tags: [01-认证与账户]
      operationId: registerUser
      summary: 用户注册（FR-101）
      description: |
        使用「用户名 + 密码 + 昵称」注册。用户名唯一且**大小写不敏感**（数据库 citext）。

        - **无需登录**。注册成功后**不自动签发令牌**，需调用 `/auth/login`。
        - 用户名重复返回 `409 AUTH_USERNAME_TAKEN`；密码强度不足返回 `400 VALIDATION_INVALID_PARAMETER`。
        - 【待确认 Q-06】邮箱是否必填与是否验证：当前假设**可选且不验证**。
        - 【待确认 A-09】昵称 1–20 字符、**不唯一**（假设 A-04）。
      security: []
      x-required-roles: [GUEST]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功，返回新用户资料（**不含令牌**）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名或邮箱已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_USERNAME_TAKEN
                message: 该用户名已被注册
                details:
                  field: username
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [01-认证与账户]
      operationId: login
      summary: 用户登录（FR-102）
      description: |
        账号密码登录，返回 Bearer 令牌（有效期 7 天，假设 A-06）。

        - **无需登录**（`security: []`）。
        - 凭据错误统一返回 `401 AUTH_INVALID_CREDENTIALS`，**不区分账号不存在与密码错误**（防账号枚举）。
        - **被处罚用户可正常登录**（permission-matrix §8），登录后 `status=RESTRICTED` 且带 `restrictedUntil`。
        - 该接口为敏感接口，触发限流返回 `429 COMMON_RATE_LIMITED`。
      security: []
      x-required-roles: [GUEST]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 凭据错误（不区分账号是否存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_INVALID_CREDENTIALS
                message: 用户名或密码错误
                details: null
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [01-认证与账户]
      operationId: refreshToken
      summary: 刷新访问令牌（预留，FR-103）
      description: |
        【待确认 Q-07】是否需要 refresh token 机制。

        **当前默认假设（A-06）：仅固定 7 天单令牌，不启用刷新**。
        因此本接口在迭代一**未启用**：启用前调用返回 `501 COMMON_NOT_IMPLEMENTED`。
        契约先行冻结路径与 DTO，启用时**不改变路径与结构**，仅切换实现开关。
      security: []
      x-required-roles: [GUEST]
      x-feature-flag: refresh-token-enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功（启用后）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: 特性未启用（【待确认 Q-07】，当前默认关闭）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: COMMON_NOT_IMPLEMENTED
                message: 刷新令牌机制当前未启用
                details:
                  question: Q-07
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [01-认证与账户]
      operationId: logout
      summary: 退出登录（FR-104）
      description: |
        使当前令牌失效。**幂等**：重复退出返回成功（终态式幂等，IDEM-A）。

        【待确认 Q-07】若最终采用无状态 JWT，服务端无法真正撤销令牌，
        此时实现为「客户端丢弃令牌 + 服务端加入黑名单（可选）」——语义在接口层冻结，实现方式待定。
      x-required-roles: [USER, ADMIN, RESTRICTED]
      responses:
        '200':
          description: 退出成功（重复调用同样返回成功）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [01-认证与账户]
      operationId: getCurrentUser
      summary: 获取当前登录用户（FR-103）
      description: |
        校验登录态并返回当前用户完整信息（含 `role` / `status` / `restrictedUntil` / 已勾选交易区域）。
        前端用于判断：是否登录、是否被处罚、是否管理员。
      x-required-roles: [USER, ADMIN, RESTRICTED]
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password:
    put:
      tags: [01-认证与账户]
      operationId: changePassword
      summary: 修改密码（permission-matrix 2.10）
      description: |
        需校验原密码（`oldPassword`）。**必须本人**。
        原密码错误返回 `401 AUTH_INVALID_CREDENTIALS`。
        **被处罚用户允许修改密码**（非交易写入，permission-matrix §8）。
      x-required-roles: [USER, ADMIN, RESTRICTED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===================================================================
  # 02 个人资料（FR-105 ~ FR-108）
  # ===================================================================

  /users/me/profile:
    put:
      tags: [02-个人资料]
      operationId: updateMyProfile
      summary: 修改昵称与头像（FR-105 / FR-106）
      description: |
        修改昵称（1–20 字符，不唯一 A-04）与头像。**必须本人**。

        - **被处罚用户在处罚期内禁止修改昵称与头像**（假设 A-13 / Q-12）：
          返回 `403 USER_RESTRICTED_CANNOT_WRITE`。
        - 头像需先通过 `POST /files/images` 上传取得 URL；传 `null` 表示删除头像。
        - 【待确认 A-05】头像 1 张、JPG/PNG/WebP、≤5MB。
      x-required-roles: [USER]
      x-forbidden-for-restricted: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 修改成功，返回更新后的用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/trade-zones:
    put:
      tags: [02-个人资料]
      operationId: setMyTradeZones
      summary: 设置常用交易区域（FR-107）
      description: |
        从**预设交易区域列表**勾选 **1–5 个**。**只允许勾选，不接受自由文本地址**（R-15 / GEO-01 / GEO-02）。

        - **被处罚用户允许修改**（非交易写入，permission-matrix §8）。
        - 少于 1 个或多于 5 个返回 `400 VALIDATION_INVALID_PARAMETER`。
        - 传入不存在的区域 ID 返回 `422 TRADE_ZONE_NOT_FOUND`。
        - **【待确认 Q-01/Q-02】**：当前区域为占位数据（`CAMPUS_A`、`COMMUNITY_A1` 等），
          替换真实校区/社区时**不改变本接口路径与请求结构**。
        - 本迭代**不读定位、不填住址、不做地图**（OOS-05 / OOS-06）。
      x-required-roles: [USER, RESTRICTED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTradeZonesRequest'
      responses:
        '200':
