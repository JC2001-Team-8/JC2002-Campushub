  # 06 订单与付款（FR-303 ~ FR-311）
  # ===================================================================

  /orders:
    post:
      tags: [06-订单与付款]
      operationId: submitOrder
      summary: 提交订单 / 库存预留（FR-303 / FR-304）
      description: |
        **必须登录且未被处罚**。**核心语义：占用发生在下单时（R-16），不是付款时。**

        行为：
        1. 校验购物车条目有效、商品在售且**未被占用**；
        2. **同一订单只包含一个卖家的商品**（C-02）；跨卖家时**自动拆成多笔订单**（R-05）；
        3. 每笔订单**立即占用商品**（`item_occupations` 写入 + 商品 → `RESERVED`），
           并记录 `expiresAt = now + 30 分钟`（假设 A-01）；
        4. 清空已下单的购物车条目。

        **幂等（必须）**：`Idempotency-Key` 必填（R-17）。同键重复提交**只创建一次**，
        返回**同一组订单**（不重复拆单、不重复占用），HTTP 200/201 与首次一致。

        **并发**：与「商品被他人抢先占用」竞争时，只有一个请求成功（R-18 条件更新 +
        `uq_item_occ_active_item` 部分唯一索引）；失败方返回 `409 ITEM_ALREADY_RESERVED`。

        失败语义（【待确认 Q-24】，假设 A-17：**整批失败**，不产生部分下单）：
        任一所选商品不可用时，整批提交失败，**不创建任何订单**。
      x-required-roles: [USER]
      x-forbidden-for-restricted: true
      x-idempotency: required
      x-state-transition: "'（无） → PENDING_PAYMENT（O-01）；商品 IN_SALE → RESERVED（I-07）'"
      x-locking: "'部分唯一索引 uq_item_occ_active_item + 条件更新 items.status'"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '201':
          description: 下单成功（可能拆成多笔订单）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
