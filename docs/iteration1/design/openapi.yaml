      operationId: relistItem
      summary: 重新上架（FR-204）
      description: |
        **仅本人**。`OFF_SHELF` → `IN_SALE`（I-06）。**幂等**：重复上架返回成功态。

        - 商品若**已被占用**或存在冲突，返回 `409 ITEM_LOCKED_BY_OCCUPATION`（FR-204：已被占用则不可上架）。
        - **`BANNED`（违规下架）不可自行上架**：返回 `409 ITEM_BANNED_CANNOT_RELIST`，
          仅管理员可通过 `POST /admin/items/{itemId}/restore` 恢复（I-16）。
        - **被处罚用户禁止重新上架**（交易写入），返回 `403 USER_RESTRICTED_CANNOT_WRITE`。
      x-required-roles: [USER]
      x-forbidden-for-restricted: true
      x-state-transition: "'OFF_SHELF → IN_SALE（I-06）'"
      parameters:
        - name: itemId
          in: path
          required: true
