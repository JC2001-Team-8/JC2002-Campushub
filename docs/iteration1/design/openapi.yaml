      summary: 下架商品（FR-203）
      description: |
        **仅本人**。`IN_SALE` → `OFF_SHELF`（I-05）。**幂等**：重复下架返回成功态（IDEM-A）。

        - 存在**进行中占用**时不可下架（需先终结交易），返回 `409 ITEM_LOCKED_BY_OCCUPATION`。
        - **卖家主动下架 != 违规下架**：主动下架后可用 `POST /items/{itemId}/relist` 恢复（I-06）。
        - `BANNED`（违规下架）不可通过本接口改变。
      x-required-roles: [USER]
      x-forbidden-for-restricted: false
      x-state-transition: "'IN_SALE → OFF_SHELF（I-05）'"
