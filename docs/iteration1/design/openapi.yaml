  /swap-proposals:
    post:
      tags: [09-交换提议]
      operationId: createSwapProposal
      summary: 发起交换提议（FR-404）
      description: |
        **必须登录且未被处罚**。用**整个交换包**向**他人的一件或多件商品**发起交换提议。

        前置条件（不满足返回 409 / 422）：
        - 交换包 1–5 件且属本人；目标商品 ≥1 件且**全部属于同一目标用户**（C-04）；
        - 目标商品 `swapPreference=ACCEPTING`，否则 `422 SWAP_TARGET_NOT_ACCEPTING`（E-08）；
        - **双方同交易区域**，否则 `422 TRADE_ZONE_MISMATCH`（E-17 / OOS-07 不做跨区）；
        - 不能与自己交换（`proposer != target`），否则 `422 SWAP_SELF_PROPOSAL_NOT_ALLOWED`；
        - **所有涉及商品当前均未被占用**，否则 `409 SWAP_ITEM_OCCUPIED`（E-10）/ `ITEM_ALREADY_RESERVED`。

        副作用：**同时占用**交换包内全部商品与目标全部商品（→ `SWAPPING`，R-23），
        记录 `expiresAt = now + 72h`（假设 A-02）。

        **幂等（必须）**：`Idempotency-Key` 必填。同键重复发起**只创建一条提议**（IDEM-A）。

        **注意**：仅支持**一对一交换**，不支持多人交换链（OOS-02）。
      x-required-roles: [USER]
      x-forbidden-for-restricted: true
      x-idempotency: required
      x-state-transition: "'（无） → PENDING（S-01）；双方商品 IN_SALE → SWAPPING（I-11）'"
      x-locking: "'部分唯一索引 uq_item_occ_active_item（同一商品同时最多一个进行中占用）'"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSwapProposalRequest'
      responses:
        '201':
          description: 提议已发起（双方商品已被占用）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SwapProposalDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            商品被其他交换占用（E-10 / `SWAP_ITEM_OCCUPIED`）、
            被订单占用（`ITEM_ALREADY_RESERVED`）、
            商品已在其他进行中交换包（`SWAP_ITEM_IN_ACTIVE_BUNDLE`）、
            或幂等键冲突（E-16）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SWAP_ITEM_OCCUPIED
                message: 商品已被其他进行中的交换占用
                details:
                  itemId: 5
                  currentStatus: SWAPPING
                  occupiedBy: SWAP
                traceId: 7f9c1a2b3d4e5f60
                timestamp: "'2026-10-12T13:20:41Z'"
        '422':
          description: |
            目标商品不接受交换（E-08）、跨区域（E-17）、
            包件数越界（E-07）、物品不属于本人、或自己与自己交换。
