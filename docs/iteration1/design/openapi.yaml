  /swap-proposals/{proposalId}/accept:
    post:
      tags: [09-交换提议]
      operationId: acceptSwapProposal
      summary: 整包接受交换提议（FR-405）
      description: |
        **仅目标方**（`target`）。`PENDING` → `ACCEPTED`（S-02），保持占用，并**生成一次性交换码**。

        - **整包接受（all-or-nothing）**：接受即接受提议中**全部**目标商品，
          同时占用交换包内**全部**商品。**不支持部分接受**（OOS-04 / R-22）：
          **本接口不接受任何物品子集参数**；若请求体携带物品列表将被忽略或返回
          `422 SWAP_PARTIAL_ACCEPT_NOT_SUPPORTED`。
        - **幂等（IDEM-B）**：重复接受**明确失败**，返回
          `409 SWAP_PROPOSAL_ALREADY_ACCEPTED` + 当前状态；**不重复生成交换码**（E-09）。
        - **并发**：「接受 vs 拒绝 vs 过期」竞争时**只允许一方成功**
          （R-18 条件更新 `WHERE status='PENDING'`）。
        - 若任一涉及商品已被其他方占用，**整笔接受失败**（不产生部分占用），
          返回 `409 SWAP_ITEM_OCCUPIED`（E-10）。
        - 状态非 `PENDING` 返回 `409 SWAP_PROPOSAL_ALREADY_FINALIZED`（E-09）。
      x-required-roles: [USER]
      x-forbidden-for-restricted: true
      x-idempotency: required
      x-state-transition: "'PENDING → ACCEPTED（S-02）；生成 swap_code（C-05）'"
      x-locking: "'条件更新 WHERE status = PENDING（受影响行数=0 → 409）'"
      x-idempotency-semantics: IDEM-B
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
